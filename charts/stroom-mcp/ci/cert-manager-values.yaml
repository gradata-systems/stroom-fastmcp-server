# Rendered in CI: cert-manager certificate, overridden policy, rules and conventions, several replicas,
# audit log on a claim per replica (StatefulSet).
publicBaseUrl: https://stroom-mcp.example.com
stroom: {url: https://stroom.example.com}
oidc: {issuerUrl: https://keycloak.example.com/realms/stroom}
tls:
  certManager: {enabled: true, issuerRef: {name: internal-ca}}
replicaCount: 2
statelessHttp: true
requestState: {keys: [ci-not-a-real-key-0123456789abcdef0123]}
podDisruptionBudget: {enabled: true}
accessPolicy:
  pipeline_templates:
    translation: {folders: [System/Template Pipelines], names: ['Event Data (*)']}
errorRules: |
  rules:
    - {severity: [FATAL], class: blocking, reason: 'Fatal error stops processing'}
conventions:
  mini.yaml: {name: mini, description: CI profile, structure: flat, field_map: {}}
build: {defaultConvention: mini}
# Audit log on a claim per replica, which makes the workload a StatefulSet.
audit:
  file:
    enabled: true
    persistence: {enabled: true, size: 5Gi}
