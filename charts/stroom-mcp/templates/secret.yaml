{{- $esKey := and (not .Values.elasticsearch.apiKey.existingSecret) .Values.elasticsearch.apiKey.value }}
{{- $rsKeys := and (not .Values.requestState.existingSecret) .Values.requestState.keys }}
{{- if or $esKey $rsKeys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stroom-mcp.secretName" . }}
  labels:
    {{- include "stroom-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $esKey }}
  es-api-key: {{ $esKey | b64enc | quote }}
  {{- end }}
  {{- if $rsKeys }}
  request-state-keys: {{ join "," $rsKeys | b64enc | quote }}
  {{- end }}
{{- end }}
