[project]
name = "stroom-fastmcp-server"
version = "0.17.13"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "elementpath>=5.1.4",
    "fastmcp>=4.1.0",
    "httpx>=0.28",
    "lxml>=6.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "saxonche>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["no_step_recorded: processing test that keeps the step gate active"]
