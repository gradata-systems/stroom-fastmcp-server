[project]
name = "stroom-fastmcp-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.3",
    "httpx>=0.28",
    "lxml>=6.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
agent = [
    "langchain-core>=1.6.5",
    "langchain[openai]>=1.4.2",
    "langgraph>=1.2.12",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.22",
    "saxonche>=13.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
